name: Deploy TEST site
# Publishes platform/dist plus the /unsubscribe Pages Function to the Cloudflare Pages TEST project
# to the league-release preview after quality gates succeed. Production is never touched here.
# Private deployment setup is deferred; opt in with ENABLE_TEST_DEPLOY=true after configuring secrets.
on:
  workflow_run:
    workflows: ["Platform quality gates"]
    types: [completed]
    branches: ["upgrade/secure-platform"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-test-deploy
  cancel-in-progress: true
jobs:
  deploy:
    if: >-
      ${{ vars.ENABLE_TEST_DEPLOY == 'true' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/upgrade/secure-platform') ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy the commit that actually passed CI, not a newer branch tip.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Manual dispatch has no upstream quality run. Verify the checked-out commit
      # before any deployment secrets are used.
      - if: github.event_name == 'workflow_dispatch'
        run: pnpm lint && pnpm test:coverage && pnpm build
      - if: github.event_name == 'workflow_dispatch'
        run: pnpm exec playwright install --with-deps chromium
      - if: github.event_name == 'workflow_dispatch'
        run: pnpm test:e2e
      - if: github.event_name == 'workflow_dispatch'
        run: pnpm audit --audit-level moderate
      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UNSUBSCRIBE_SIGNING_KEY: ${{ secrets.UNSUBSCRIBE_SIGNING_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_SERVICE_ROLE_KEY UNSUBSCRIBE_SIGNING_KEY VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required deployment configuration is missing: $name"
              exit 1
            fi
          done
      - name: Build TEST bundle
        env:
          VITE_APP_ENV: test
          VITE_TEST_PROJECT_REF: wgolevihkvmosajumzvl
          VITE_SUPABASE_URL: https://wgolevihkvmosajumzvl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm build
      - name: Configure unsubscribe function bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UNSUBSCRIBE_SIGNING_KEY: ${{ secrets.UNSUBSCRIBE_SIGNING_KEY }}
        run: |
          printf '%s' "https://wgolevihkvmosajumzvl.supabase.co" | npx --yes wrangler@4 pages secret put SUPABASE_URL --project-name maplewood-league-test --env preview
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx --yes wrangler@4 pages secret put SUPABASE_SERVICE_ROLE_KEY --project-name maplewood-league-test --env preview
          printf '%s' "$UNSUBSCRIBE_SIGNING_KEY" | npx --yes wrangler@4 pages secret put UNSUBSCRIBE_SIGNING_KEY --project-name maplewood-league-test --env preview
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name maplewood-league-test --branch league-release --commit-dirty=true
