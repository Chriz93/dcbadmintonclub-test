name: TEST site vote reminders (TEST database)
# TEST database and TEST-prefixed secrets only. Default dry-run; live test deliveries
# are always redirected to TEST_INBOX, at most three per run. Real player delivery is disabled.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      smoke_test:
        description: Send one test email to the league inbox to prove SMTP works (no players involved)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: test-reminders
  cancel-in-progress: false
jobs:
  remind:
    if: github.repository == 'Chriz93/dcbadmintonclub-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: legacy/automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check operator secrets
        id: gate
        env:
          SERVICE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_KEY: ${{ secrets.TEST_GMAIL_APP_PASSWORD }}
        run: |
          if [ -z "$SERVICE_KEY" ] || [ -z "$GMAIL_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"; echo "Secrets not configured; skipping (nothing sent)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        run: npm install --no-audit --no-fund --omit=dev nodemailer@10 web-push@3
      - if: steps.gate.outputs.ready == 'true'
        run: node --test
      - name: Reminder pass
        if: steps.gate.outputs.ready == 'true'
        env:
          TZ: America/Toronto
          SUPABASE_URL: https://wgolevihkvmosajumzvl.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://chriz93.github.io/dcbadmintonclub-test/
          DELIVERY_MODE: ${{ vars.TEST_DELIVERY_MODE || 'dry-run' }}
          ALLOW_REAL_RECIPIENTS: 'false'
          GMAIL_USER: maplewoodbadmintonleague@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.TEST_GMAIL_APP_PASSWORD }}
          TEST_INBOX: maplewoodbadmintonleague@gmail.com
          ORGANIZER_EMAIL: christygeorge993@gmail.com
          VAPID_PUBLIC_KEY: BIiSiPbF4u3zXEy_PWYHGc6he375fIDM-yXoCBzKLIVCWoTc_BXejLMBFIXG_Zrl8178H9Ztfo1eXFvoDefKiNE
          VAPID_PRIVATE_KEY: ${{ secrets.TEST_VAPID_PRIVATE_KEY }}
          SMOKE_TEST: ${{ inputs.smoke_test == true && 'true' || 'false' }}
        run: node remind.mjs
